# Move action HW test sequence (LLM output mocking).
# Used by: system_hw_test/move_action_hw_test.py
#
# Valid action values (MovementAction enum):
#   - "go to L1"   | "go to L2"   | "go to L3" | "go to L8" | "go to NG"
#   - "go to L8 main entrance" | "go to L8 stair" | "go to L8 elevator"
#   - "slow down"  | "speed up"
#   - "stand up"   | "stand down" | "damp" | "stop move" | "resume"
# Note: "stop move" sets speed to 0 (경로/스레드 유지). "resume" restores pre-pause speed.
#
# Sequence format:
#   - Each item is either a string (action only) or { action: "...", delay_after_sec: N }.
#   - String: run that action, then wait output_interval_sec before the next.
#   - Object: run action, then wait delay_after_sec before the next (overrides default).
#   - Order and timing are fully configurable per step.

# Default delay after each output when not specified (seconds)
output_interval_sec: 1.0

# How many times to run the sequence. 1 = once, 2 = twice. 0 = infinite until Ctrl+C
repeat_count: 1

# Ordered list: action only (use default interval) or { action, delay_after_sec }
sequence:
  - action: "go to L8 elevator"
    delay_after_sec: 30
  - action: "slow down"
    delay_after_sec: 5
  - action: "slow down"
    delay_after_sec: 5